<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found - Moonis Ahmed</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Redirects 404s to index.html with the path stored in sessionStorage
      const path = window.location.pathname + window.location.search + window.location.hash;
      sessionStorage.setItem('redirectPath', path);
      window.location.replace('/');
    </script>
    <style>
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: #ffffff;
        color: #1a1a1a;
      }
      .container {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-size: 2rem;
        font-weight: 500;
        margin-bottom: 1rem;
      }
      p {
        color: #555555;
        margin-bottom: 2rem;
      }
      a {
        display: inline-block;
        padding: 9px 20px;
        background: #1a1a1a;
        color: #fff;
        text-decoration: none;
        border-radius: 6px;
        font-size: 14px;
      }
      a:hover {
        background: #333;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div class="container">
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist.</p>
        <a href="/">Go to Homepage</a>
      </div>
    </noscript>
  </body>
</html>
